<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <script src="js/abrir-servidor.js"></script>
        <title>
            Digital Track | Criar Conta
        </title>
        <link rel="stylesheet" href="css/geral.css">
        <link rel="stylesheet" href="css/cadastro.css">
    </head>
    <body class="pagina pagina-acesso">
        <div class="area-acesso">
            <div class="caixa-acesso">
                <div class="faixa-colorida"></div>
                <div class="cabecalho-acesso">
                    <a href="index.html" class="imagem-acesso">
                        <img src="assets/digitaltrack-logo.svg" alt="Digital Track Logo">
                    </a>
                    <p class="titulo-grande titulo-acesso">
                        Crie sua Conta Global
                    </p>
                    <p class="descricao-acesso">
                        Inicie sua jornada no e-commerce internacional e acesse a dashboard analítica.
                    </p>
                </div>
                <div class="mensagem" id="msg_senha" role="status" aria-live="polite">
                    <img class="icone" src="assets/icones/atencao-94a3b8.svg" alt="">
                    <span id="texto_mensagem">
                        Mensagem de aviso
                    </span>
                </div>
                <div class="campos-acesso" onkeydown="if (event.key == &#x27;Enter&#x27;) { event.preventDefault(); cadastrar(); }">
                    <div class="campo">
                        <label>
                            Nome Completo
                        </label>
                        <div class="caixa-campo">
                            <input type="text" id="ipt_nome" class="entrada-acesso" placeholder="Ex: Roberto Silva" required autocomplete="name" maxlength="100" aria-label="Nome Completo">
                            <img class="icone icone-campo" src="assets/icones/usuario-94a3b8.svg" alt="">
                        </div>
                    </div>
                    <div class="campo">
                        <label>
                            E-mail Profissional
                        </label>
                        <div class="caixa-campo">
                            <input type="email" id="ipt_email" class="entrada-acesso" placeholder="seuemail@exemplo.com" required autocomplete="email" maxlength="100" aria-label="E-mail">
                            <img class="icone icone-campo" src="assets/icones/envelope-94a3b8.svg" alt="">
                        </div>
                    </div>
                    <div class="campo">
                        <label>
                            Nível de Experiência
                        </label>
                        <div class="caixa-campo">
                            <select id="ipt_nivel" class="entrada-acesso" style="padding-left: 46px; cursor: pointer;" autocomplete="name" maxlength="100" aria-label="Nível de Experiência">
                                <option value="Iniciante">
                                    Iniciante (Nunca vendi online)
                                </option>
                                <option value="Intermediário">
                                    Intermediário (Já vendo no Brasil e quero expandir)
                                </option>
                                <option value="Avançado">
                                    Avançado (Já opero com tráfego e e-commerce)
                                </option>
                            </select>
                            <img class="icone icone-campo" src="assets/icones/camadas-94a3b8.svg" alt="">
                        </div>
                    </div>
                    <div class="campo">
                        <label>
                            Senha
                        </label>
                        <div class="caixa-campo">
                            <input type="password" id="ipt_senha" class="entrada-acesso" placeholder="Mínimo 6 caracteres" required oninput="verificarSenha(this.value)" autocomplete="new-password" maxlength="128" aria-label="Senha">
                            <img class="icone icone-campo" src="assets/icones/cadeado-94a3b8.svg" alt="">
                            <button type="button" class="botao-senha" aria-label="Mostrar senha" aria-pressed="false" onclick="mostrarSenha(&#x27;ipt_senha&#x27;, this)">
                                <img class="icone" src="assets/icones/olho-94a3b8.svg" alt="">
                            </button>
                        </div>
                        <div class="medidor-senha">
                            <div class="barra-senha" id="barra_senha">
                            </div>
                        </div>
                        <span class="texto-senha" id="texto_senha">
                            Digite uma senha segura
                        </span>
                    </div>
                    <div class="campo">
                        <label>
                            Confirmação da Senha
                        </label>
                        <div class="caixa-campo">
                            <input type="password" id="ipt_confirmarSenha" class="entrada-acesso" placeholder="Repita sua senha" required autocomplete="new-password" maxlength="128" aria-label="Confirmação da Senha">
                            <img class="icone icone-campo" src="assets/icones/escudo-00f5a0.svg" alt="">
                            <button type="button" class="botao-senha" aria-label="Mostrar senha" aria-pressed="false" onclick="mostrarSenha(&#x27;ipt_confirmarSenha&#x27;, this)">
                                <img class="icone" src="assets/icones/olho-94a3b8.svg" alt="">
                            </button>
                        </div>
                    </div>
                    <label class="opcao">
                        <input type="checkbox" id="chk_termos" required checked aria-label="chk_termos">
                        <span>
                            Concordo com os Termos de Uso e Política de Privacidade
                        </span>
                    </label>
                    <button type="button" class="botao botao-colorido botao-brilho" style="width: 100%; padding: 13px;" onclick="cadastrar()" id="btn_cadastrar">
                        <img class="icone" src="assets/icones/usuario-050811.svg" alt="">
                        Finalizar Cadastro
                    </button>
                </div>
                <div class="acessos">
                    Já possui uma conta na plataforma?
                    <a href="login.html">
                        Fazer Login
                    </a>
                </div>
            </div>
        </div>
        <script src="js/validacoes.js"></script>
        <script src="js/acesso.js"></script>
    </body>
</html>
