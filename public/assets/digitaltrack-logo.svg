<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- DIGITAL TRACK - OFFICIAL BRAND IDENTITY (FOLD & GLOBAL COMMERCE) -->
  <defs>
    <linearGradient id="foldGreenMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="foldCyanMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9f5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="foldShadowMaster" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Símbolo: Fold Ribbon (Dobra Geométrica de Moeda & Monograma DT) -->
  <g transform="translate(34, 22)">
    <!-- Asa 1: Curva em Esmeralda Líquido -->
    <path d="M 12 60 L 36 18 C 42 8, 58 8, 64 18 L 74 36" 
          fill="none" stroke="url(#foldGreenMaster)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Asa 2: Curva Cruzada em Hiper Ciano -->
    <path d="M 28 32 L 62 70 C 68 78, 80 76, 84 66 L 88 54" 
          fill="none" stroke="url(#foldCyanMaster)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#foldShadowMaster)" />

    <!-- Ponto Central de Liquidez / Conversão -->
    <circle cx="48" cy="46" r="4.5" fill="#ffffff" />
  </g>

  <!-- Tipografia: digitaltrack. + GLOBAL COMMERCE & PERFORMANCE -->
  <g transform="translate(140, 68)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Plus Jakarta Sans', sans-serif" 
          font-size="40" letter-spacing="-1px">
      <tspan font-weight="300" fill="#f8fafc">digital</tspan>
      <tspan font-weight="800" fill="#ffffff">track</tspan>
      <tspan font-weight="900" fill="#00f5a0">.</tspan>
    </text>
    <text y="23" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Plus Jakarta Sans', sans-serif" 
          font-weight="600" font-size="10.2" letter-spacing="4.8" fill="#64748b">
      GLOBAL COMMERCE &amp; PERFORMANCE
    </text>
  </g>
</svg>
